<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REFV-KG データビューア</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">REFV-KG</p>
      <h1>データビューア</h1>
      <p class="subtitle">環境影響評価に関するデータを一覧で閲覧できます。</p>
    </div>
    <div id="status" class="status" aria-live="polite">読み込み中…</div>
  </header>

  <main>
    <section class="toolbar" aria-label="表示設定">
      <label class="search-field">
        <span>キーワード検索</span>
        <input id="searchInput" type="search" placeholder="全項目から検索" autocomplete="off">
      </label>
      <label>
        <span>表示件数</span>
        <select id="pageSize">
          <option value="25">25件</option>
          <option value="50" selected>50件</option>
          <option value="100">100件</option>
        </select>
      </label>
      <button id="clearButton" class="secondary" type="button">検索をクリア</button>
      <label class="file-button" for="fileInput">JSONを選択</label>
      <input id="fileInput" type="file" accept="application/json,.json" hidden>
    </section>

    <div id="loadHelp" class="notice" hidden>
      <strong>JSONを自動で読み込めませんでした。</strong>
      「JSONを選択」から <code>refv-ja.json</code> を指定するか、ローカルWebサーバー経由で開いてください。
    </div>

    <section class="table-card" aria-label="データ一覧">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>主語</th>
              <th>関係</th>
              <th>目的語</th>
              <th>発言者分類</th>
              <th>発言者</th>
              <th>意見・対応</th>
              <th>本文</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty" hidden>該当するデータがありません。</div>
    </section>

    <nav class="pagination" aria-label="ページ切り替え">
      <button id="prevButton" type="button">前へ</button>
      <span id="pageInfo">—</span>
      <button id="nextButton" type="button">次へ</button>
    </nav>
  </main>

  <dialog id="textDialog" aria-labelledby="dialogTitle">
    <div class="dialog-header">
      <h2 id="dialogTitle">本文</h2>
      <button id="closeDialog" class="icon-button" type="button" aria-label="閉じる">×</button>
    </div>
    <p id="dialogMeta" class="dialog-meta"></p>
    <div id="dialogText" class="dialog-text"></div>
    <div class="dialog-footer"><button id="closeDialogBottom" type="button">閉じる</button></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
