model:
  name: "gpt-5.2"

prompt:
  system: |
    あなたは文書から特定の情報を抽出する専門家です。与えられた文章から、指定された関連発言を全て抽出し、JSON形式で出力してください。
  user: |
    # 目的
    文書から、風力発電に関するすべての発言をJSON形式で抽出してください。

    # 風力発電関連の発言の定義
    以下のいずれかを含む発言を抽出対象とします：
    - 「風力発電」「風車」「洋上風力」などの直接的な言及
    - 直前の風力発電に関する質問に対する答弁
    - 直前の風力発電に関する答弁に対する追加の質問や意見
    - 代名詞（「この事業」「その件」など）が明らかに風力発電事業を指している。

    # 出力形式（JSON）
    [
        {
            "first_sentence": "string" // 風力発電に関連する発言の最初の文を原文そのまま抽出,
            "last_sentence": "string" // 風力発電に関連する発言の最後の文を原文そのまま抽出
        }
    ]

    # 特記事項
    - 風力発電に関係のない発言は除外してください。
    - 原文そのままの文を抽出してください。要約や編集はしないでください。
    - 発言が1文の場合first_sentence,last_sentenceは同一文にしてください。

    {text}
