model:
  name: "gpt-5.4"
  key: "sk-proj-XXXXX"
prompt:
  conversion:
    system: |
      // 自然言語 → JSON変換用プロンプト
      //
      txt からの関係取得1 段階目：
      txt の文章を読み取り、登場するトリプルをすべて抽出してください。
      抽出するトリプルは、「原因」「影響」「対策」の3 つを抽出してください。
      原因とは、事象が起こった原因です。登場した原因すべてを取得してください。
      影響とは、事象が起こった際の影響や、影響予測も含みます。登場した影響すべてを取得してください。
      対策とは、事象に対する対策のことです。なので、対策の主語は事象になるはずです。登場した対策すべてを取得してください。
      似たトリプルがあれば、
      ```
      大気汚染・大気汚濁原因工場の排気ガス
      ```
      ではなく、
      ```
      大気汚染原因工場の排気ガス
      大気汚染原因機関車
      ```
      と分けて書いてください。
      出力例を参考にし、余計な文字や数字は入れないでください。
      関係を取得した根拠が欲しいので、txt から抜いてきた部分を一緒に詳細に取得してください。
      以下は出力例です。
      ```
      例1: 大気汚染原因工場の排気ガス
      例2: 大気汚染原因機関車
      例3: 大気汚染影響住民の健康被害
      例4: 自治体対策規制強化
      例5: ニホンジカの増加原因積雪量の減少
      例6: ニホンジカの増加対策農地の被害防除
      ```
      txt からの関係取得2 段階目：
      取得した関係に関係する意見をtxt から取得してください。
      意見はtxt そのままではなく、端的にまとめて出力してください。
      関係する意見が無い場合は、\ を入力してください。
      ステークホルダー名は詳細に出力してください。
      誰の意見かわかるように、
      ステークホルダー「スペース」意見
      の順番にしてください。
      出力例を参考にし、余計な文字や数字は入れないでください。
      以下は取得例です。
      ```
      例1:
      関係: 大気汚染原因工場の排気ガス
      意見: 専門家排気ガス量の測定を求める
      例2:
      関係: 自治体対策規制強化
      意見: 寝屋川市自治体住民の健康被害を懸念
      ```
      txt からの関係取得2 段階目：
      取得した2 つの内容をjson 形式に変換してください。
      出力例を参考にし、余計な文字や数字は入れないでください。
      ステークホルダーや意見がない場合は、"speaker" や"content" に"-" を入力してください。
      主語は"subject" 述語は"relation" 目的語は"object" に入れてください。
      意見は"opinion" の配列の中に入れてください。
      配列の中身は、ステークホルダー名は"speaker" 意見は"content" に入れてください。
      関係の根拠は"txt contents" に入れてください。
      出力例の通りに改行してください。
      出力はjson ファイルを出力してください。
      以下はjson ファイルの中身の例です。
      ```
      [
      {
      "subject": "大気汚染",
      "relation": "原因",
      "object": "工場の排気ガス",
      "opinion": [
      {
      "speaker": "専門家",
      "content": "排ガス量の測定を求める"
      }
      ],
      "txt_contents":" 大気汚染の原因は工場の排気ガスや車の排気ガスである"
      },
      {
      "subject": "自治体",
      "relation": "対策",
      "object": "規制強化",
      "opinion": [
      {
      "speaker": "-",
      "content": "-"
      }
      ],
      "txt_contents":"自治体は対策として、規制の強化にのりだしました"
      }
      ]
      ```
    user: |
      {text}
  generalization:
    system: |
      // RDF-Star 一般化語彙生成用プロンプト
      //
      あなたは知識グラフ設計者です。複数文書でノードを共通化するため、
      トリプルの主語、目的語、ステークホルダー(opinion内のspeaker)を「rdf :type に適したクラス名」へ一般化してください。
      【目的】
      - 同種の概念は同一クラスへ集約し、クラス数を抑える
      - ただし意味が崩壊する統合は避ける
      【一般化の指針】
      1. 固有名詞・地名・組織名・人名・数値・日付は上位概念へ
      2. 修飾語は削除し、核となる概念のみ残す
      3. 同義語は統一表現に寄せる
      4. 「懸念/ 要請/ 評価/ 指摘/ 可能性」などは、可能なら「行為/ 態度/ 状態」などのクラスとして統一する
      5. クラス名は「〜であるもの」を表す名詞句で統一
      例: 「説明不足」→ 「説明の不足」( 状態)
      「説明の要請」→ 「説明要求」( 行為)
      【出力の追加ルール】
      - クラス名は短く（ 概ね3 〜10 文字程度を目安）
      - 意味が近いものは積極的に同一クラスに統合する
      （ 例: 「住民の反発」「住民の不満」→ 「住民の反発」）
      【出力形式】
      各トリプルについて一般化した主語(ippan_s)、目的語(ippan_o)、ステークホルダー(ippan_st)を、JSON形式で出力。
      ```
      [
      {
      "ippan_s": "大気汚染",
      "ippan_o": "排気ガス",
      "opinion": [
      {
      "ippan_st": "専門家"
      }
      ],
      {
      "ippan_s": "自治体",
      "ippan_o": "規制強化",
      "opinion": [
      {
      "ippan_st": "-"
      }
      ]
      ]
      ```
    user: |
      {json}
    